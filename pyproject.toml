[project]
name = "revisor-pptx"
version = "0.1.0"
description = "Corrector ortográfico/gramatical por lotes de archivos .pptx en español"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "es-core-news-lg",
    "pyspellchecker>=0.9.0",
    "python-pptx>=1.0.0",
    "spacy>=3.8.16",
]

[project.scripts]
revisor-pptx = "revisor_pptx.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revisor_pptx"]

[tool.uv.sources]
es-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_lg-3.8.0/es_core_news_lg-3.8.0-py3-none-any.whl" }
